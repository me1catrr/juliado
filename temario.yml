          - id: J2.7
            titulo: Regresión
            slug: j2-7-regresion
            perfil: [mse, uco, planta]
            duracion: {lectura: 24, practica: 66}
            python: true
            contenidos: [GLM.jl, diagnóstico de residuos, frecuencia frente a temperatura]
          - id: J2.8
            titulo: "Aprendizaje automático: clasificación de estados"
            slug: j2-8-ml
            duracion: {lectura: 24, practica: 66}
            perfil: [mse, uco]
            python: true
            contenidos: [clasificación, validación cruzada, métricas, clasificación de eventos]

      - id: J3
        titulo: Computación científica
        carpeta: j3-computacion
        unidades:
          - id: J3.1
            titulo: Rendimiento
            slug: j3-1-rendimiento
            perfil: [mse, uco]
            duracion: {lectura: 24, practica: 66}
