          - id: J3.7
            titulo: Optimización
            slug: j3-7-optimizacion
            duracion: {lectura: 45, practica: 75}
            perfil: [mse, uco]
            contenidos: [Optim.jl, LsqFit.jl, ajuste de FRF, model updating, estrategia multi-start]
          - id: J3.8
            titulo: Señales
            slug: j3-8-senales
            perfil: [mse, uco, planta]
            duracion: {lectura: 35, practica: 85}
            contenidos: [FFTW.jl, DSP.jl, ventanas, Welch, filtros, espectrograma]
          - id: J3.9
            titulo: Grafos y algoritmos (opcional)
            slug: j3-9-grafos
            duracion: {lectura: 20, practica: 40}
            opcional: true
            perfil: [uco]
            contenidos: [Graphs.jl, recorridos, caminos mínimos]


itinerarios:
  mse:
    titulo: Estudiante de MSE (Resonancia)
    recorrido: [J1, y las unidades de J2 y J3 que piden las sesiones de MSE]
  uco:
    titulo: Docente o investigador UCO
    recorrido: [J1-J3 según nivel]
  planta:
    titulo: Personal de planta
    recorrido: [J1, J2 con pestaña Python]
