project:
  type: website
  # docs/ contiene apuntes de consulta, no páginas ni descargas públicas.
  # _plan/ son notas de trabajo (el prefijo _ ya las excluye).
  render:
    - "*"
    - "!docs/**"
  resources:
    - "!docs/**"
  post-render:
    - scripts/no_publicar_docs.ts

# La barra superior y la barra lateral las genera
# scripts/generar_estructura.jl a partir de temario.yml. No editarlas aquí.
metadata-files:
  - _navegacion.yml

lang: es
bibliography: recursos/bibliografia.bib

# Ejercicios intercalados en el texto (véase scripts/ejercicios.lua).
filters:
  - scripts/ejercicios.lua
  - scripts/referencias.lua

website:
  title: "JuliaDo"
  description: "Aprende Julia haciendo: programación y computación científica con ejemplos de ingeniería"
  site-url: https://me1catrr.github.io/juliado/
  repo-url: https://github.com/me1catrr/juliado
  repo-actions: [edit, issue]
  favicon: recursos/identidad/fig/marca.svg
  navbar:
    logo: recursos/identidad/fig/marca.svg
    logo-alt: "JuliaDo"

format:
  html:
    # styles.css es la base de estilos; marca.scss fija el color principal
    # y los acentos del sitio.
    theme:
      - cosmo
      - marca.scss
    css: styles.css
    grid:
      sidebar-width: 270px
      body-width: 880px
      margin-width: 270px
      gutter-width: 1.5rem
    toc: true
    code-copy: true
    # Corrige el enlace activo de la barra superior (véase el propio fichero).
    include-after-body: recursos/js/navbar-activo.html
    citations-hover: true
    link-citations: true
    reference-section-title: "Referencias"

# Nombres en español de los entornos numerados (def-, thm-, prp-, exm-…).
crossref:
  fig-title: "Figura"
  tbl-title: "Tabla"
  eq-prefix: "ecuación"
  thm-title: "Teorema"
  prp-title: "Proposición"
  def-title: "Definición"
  exm-title: "Ejemplo"
  lem-title: "Lema"
  cor-title: "Corolario"
  thm-prefix: "Teorema"
  prp-prefix: "Proposición"
  def-prefix: "Definición"
  exm-prefix: "Ejemplo"
  lem-prefix: "Lema"
  cor-prefix: "Corolario"

execute:
  freeze: auto
